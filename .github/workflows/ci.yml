name: Software Testing CI - Commit Stage Pipeline

# Kích hoạt pipeline tự động mỗi khi push code hoặc mở Pull Request vào nhánh main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  commit-stage-test:
    name: Run Jest Unit Tests & Health Checks
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ repository về runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Node.js (phiên bản 18)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Bước 3: Cài đặt các thư viện phụ thuộc (Dependencies) dựa trên package.json
      - name: Install Dependencies
        run: npm ci

      # Bước 4: Chạy tập kịch bản test kiểm thử đơn vị (Jest Test)
      - name: Execute Jest Unit Tests
        run: npm test
